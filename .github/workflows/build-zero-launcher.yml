name: Build ZERO Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'zero-launcher/**'
      - '.github/workflows/build-zero-launcher.yml'

permissions:
  contents: read

concurrency:
  group: zero-launcher-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ZERO Launcher debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: zero-launcher
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: zero-launcher-debug
          path: zero-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
