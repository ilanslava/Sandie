name: Build FutureLauncher APK

on:
  push:
    paths:
      - "FutureLauncher/**"
      - "FutureLauncher_v7.zip"
      - "v7-payload/READY"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble v7 archive from payload chunks
        if: ${{ hashFiles('v7-payload/READY') != '' }}
        run: |
          cat v7-payload/*.b64 | base64 --decode > FutureLauncher_v7.zip

      - name: Replace FutureLauncher with uploaded v7 source
        if: ${{ hashFiles('FutureLauncher_v7.zip') != '' }}
        run: |
          rm -rf FutureLauncher
          unzip -q FutureLauncher_v7.zip -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: FutureLauncher
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FutureLauncher-APK
          path: FutureLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
